<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gpu" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cpu" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="net" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="disk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">PIPELINE</text>
  
  <!-- Step boxes -->
  <!-- 1. Hardware Profiler -->
  <rect x="20" y="60" width="110" height="80" rx="8" fill="url(#gpu)" filter="url(#shadow)"/>
  <text x="75" y="88" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">HARDWARE</text>
  <text x="75" y="103" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">PROFILER</text>
  <text x="75" y="125" text-anchor="middle" fill="#bfdbfe" font-size="9">Step 1</text>
  
  <!-- Arrow 1-2 -->
  <path d="M135 100 L155 100" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#475569"/></marker></defs>
  
  <!-- 2. Metadata Fetcher -->
  <rect x="160" y="60" width="110" height="80" rx="8" fill="url(#net)" filter="url(#shadow)"/>
  <text x="215" y="88" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">METADATA</text>
  <text x="215" y="103" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">FETCHER</text>
  <text x="215" y="125" text-anchor="middle" fill="#a5f3fc" font-size="9">Step 2</text>
  
  <!-- Arrow 2-3 -->
  <path d="M275 100 L295 100" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 3. Predictor -->
  <rect x="300" y="60" width="110" height="80" rx="8" fill="url(#cpu)" filter="url(#shadow)"/>
  <text x="355" y="88" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">PERFORMANCE</text>
  <text x="355" y="103" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">PREDICTOR</text>
  <text x="355" y="125" text-anchor="middle" fill="#ddd6fe" font-size="9">Steps 3–4</text>
  
  <!-- Arrow 3-4 -->
  <path d="M415 100 L435 100" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 4. Ranker -->
  <rect x="440" y="60" width="110" height="80" rx="8" fill="url(#ai)" filter="url(#shadow)"/>
  <text x="495" y="88" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">STRATEGY</text>
  <text x="495" y="103" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">RANKER</text>
  <text x="495" y="125" text-anchor="middle" fill="#fde68a" font-size="9">Step 5</text>
  
  <!-- Arrow 4-5 -->
  <path d="M555 100 L575 100" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 5. Download Manager -->
  <rect x="580" y="60" width="110" height="80" rx="8" fill="url(#disk)" filter="url(#shadow)"/>
  <text x="635" y="88" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">DOWNLOAD</text>
  <text x="635" y="103" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">MANAGER</text>
  <text x="635" y="125" text-anchor="middle" fill="#a7f3d0" font-size="9">Step 8</text>
  
  <!-- Arrow 5-6 -->
  <path d="M695 100 L715 100" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 6. Executor -->
  <rect x="720" y="60" width="110" height="80" rx="8" fill="url(#gpu)" filter="url(#shadow)"/>
  <text x="775" y="88" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">MODEL</text>
  <text x="775" y="103" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">EXECUTOR</text>
  <text x="775" y="125" text-anchor="middle" fill="#bfdbfe" font-size="9">Steps 6, 9–10</text>
  
  <!-- Feedback loop arrow -->
  <path d="M775 145 L775 175 L75 175 L75 145" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <defs><marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f59e0b"/></marker></defs>
  <text x="425" y="192" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="600">SELF-CALIBRATION (Step 7)</text>
  
  <!-- Bottom section: Strategy Matrix -->
  <rect x="20" y="215" width="860" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="235" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1.5">STRATEGY MATRIX — AUTO-GENERATED PER MODEL</text>
  
  <!-- Strategy boxes -->
  <rect x="40" y="250" width="100" height="40" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="90" y="268" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">Full GPU</text>
  <text x="90" y="282" text-anchor="middle" fill="#64748b" font-size="8">8–24 rows</text>
  
  <rect x="155" y="250" width="100" height="40" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="205" y="268" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">GPU/CPU Split</text>
  <text x="205" y="282" text-anchor="middle" fill="#64748b" font-size="8">Multiple points</text>
  
  <rect x="270" y="250" width="100" height="40" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="320" y="268" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">CPU Only</text>
  <text x="320" y="282" text-anchor="middle" fill="#64748b" font-size="8">Fallback</text>
  
  <rect x="385" y="250" width="100" height="40" rx="6" fill="#2d1f4e" stroke="#8b5cf6" stroke-width="1"/>
  <text x="435" y="268" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="600">MoE Offload</text>
  <text x="435" y="282" text-anchor="middle" fill="#64748b" font-size="8">Expert-level</text>
  
  <rect x="500" y="250" width="100" height="40" rx="6" fill="#2d1f4e" stroke="#8b5cf6" stroke-width="1"/>
  <text x="550" y="268" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="600">Hot/Cold</text>
  <text x="550" y="282" text-anchor="middle" fill="#64748b" font-size="8">Neuron-level</text>
  
  <rect x="615" y="250" width="100" height="40" rx="6" fill="#2d1f4e" stroke="#8b5cf6" stroke-width="1"/>
  <text x="665" y="268" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="600">Layer Stream</text>
  <text x="665" y="282" text-anchor="middle" fill="#64748b" font-size="8">Disk → RAM</text>
  
  <rect x="730" y="250" width="130" height="40" rx="6" fill="#1a332e" stroke="#10b981" stroke-width="1"/>
  <text x="795" y="268" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600">Auto-Recommend</text>
  <text x="795" y="282" text-anchor="middle" fill="#64748b" font-size="8">Cross-model rank</text>
</svg>