<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="700" height="200" fill="url(#bg2)" rx="12"/>
  
  <text x="350" y="30" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">PLATFORM SUPPORT</text>
  
  <!-- NVIDIA -->
  <rect x="20" y="50" width="155" height="130" rx="8" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="97" y="75" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">NVIDIA</text>
  <line x1="40" y1="85" x2="155" y2="85" stroke="#22c55e" stroke-width="0.5" opacity="0.4"/>
  <text x="97" y="102" text-anchor="middle" fill="#86efac" font-size="9">CUDA Backend</text>
  <text x="97" y="118" text-anchor="middle" fill="#86efac" font-size="9">NVML Profiler</text>
  <text x="97" y="134" text-anchor="middle" fill="#86efac" font-size="9">Windows + Linux</text>
  <text x="97" y="155" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">✅ Production</text>
  <text x="97" y="170" text-anchor="middle" fill="#64748b" font-size="8">RTX 20/30/40/50</text>
  
  <!-- AMD -->
  <rect x="185" y="50" width="155" height="130" rx="8" fill="#2a1a1a" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="262" y="75" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">AMD</text>
  <line x1="205" y1="85" x2="320" y2="85" stroke="#ef4444" stroke-width="0.5" opacity="0.4"/>
  <text x="262" y="102" text-anchor="middle" fill="#fca5a5" font-size="9">HIP / Vulkan</text>
  <text x="262" y="118" text-anchor="middle" fill="#fca5a5" font-size="9">ROCm-SMI / ADL</text>
  <text x="262" y="134" text-anchor="middle" fill="#fca5a5" font-size="9">Linux + Windows</text>
  <text x="262" y="155" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">✅ Good</text>
  <text x="262" y="170" text-anchor="middle" fill="#64748b" font-size="8">RX 7000, MI series</text>
  
  <!-- Apple -->
  <rect x="350" y="50" width="155" height="130" rx="8" fill="#1a1a2e" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="427" y="75" text-anchor="middle" fill="#6366f1" font-size="13" font-weight="700">Apple</text>
  <line x1="370" y1="85" x2="485" y2="85" stroke="#6366f1" stroke-width="0.5" opacity="0.4"/>
  <text x="427" y="102" text-anchor="middle" fill="#a5b4fc" font-size="9">Metal Backend</text>
  <text x="427" y="118" text-anchor="middle" fill="#a5b4fc" font-size="9">Unified Memory</text>
  <text x="427" y="134" text-anchor="middle" fill="#a5b4fc" font-size="9">macOS</text>
  <text x="427" y="155" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="600">✅ Good</text>
  <text x="427" y="170" text-anchor="middle" fill="#64748b" font-size="8">M1/M2/M3/M4</text>
  
  <!-- CPU -->
  <rect x="515" y="50" width="155" height="130" rx="8" fill="#1e1e1e" stroke="#64748b" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="592" y="75" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">CPU</text>
  <line x1="535" y1="85" x2="650" y2="85" stroke="#64748b" stroke-width="0.5" opacity="0.4"/>
  <text x="592" y="102" text-anchor="middle" fill="#94a3b8" font-size="9">SIMD / BLAS</text>
  <text x="592" y="118" text-anchor="middle" fill="#94a3b8" font-size="9">OS APIs</text>
  <text x="592" y="134" text-anchor="middle" fill="#94a3b8" font-size="9">All Platforms</text>
  <text x="592" y="155" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">✅ Fallback</text>
  <text x="592" y="170" text-anchor="middle" fill="#64748b" font-size="8">Intel / AMD CPU</text>
</svg>