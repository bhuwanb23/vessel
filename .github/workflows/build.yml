name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  # ===========================================================================
  # Windows NVIDIA (CUDA) — Primary build
  # ===========================================================================
  build-windows-cuda:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          method: network

      - name: Configure CMake
        run: cmake -B build -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-windows-cuda
          path: build/bin/${{ env.BUILD_TYPE }}/vessel.exe

  # ===========================================================================
  # Windows CPU-only — Fallback build
  # ===========================================================================
  build-windows-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-windows-cpu
          path: build/bin/${{ env.BUILD_TYPE }}/vessel.exe

  # ===========================================================================
  # Linux CPU-only — Universal build
  # ===========================================================================
  build-linux-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-linux-cpu
          path: build/bin/vessel

  # ===========================================================================
  # macOS (Metal) — Apple Silicon build
  # ===========================================================================
  build-macos-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -B build -DGGML_METAL=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-macos-metal
          path: build/bin/vessel

  # ===========================================================================
  # Tests — Run on every PR
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Run Tests
        run: |
          cd build/bin/Debug
          ./e2e_test
          ./recommend_test
          ./catalog_test
          ./predictor_test

  # ===========================================================================
  # Create GitHub Release (on tag push)
  # ===========================================================================
  release:
    needs: [build-windows-cuda, build-windows-cpu, build-linux-cpu, build-macos-metal]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release files
        run: |
          mkdir -p release
          mv vessel-windows-cuda/vessel.exe release/vessel-windows-cuda.exe
          mv vessel-windows-cpu/vessel.exe release/vessel-windows-cpu.exe
          mv vessel-linux-cpu/vessel release/vessel-linux-cpu
          mv vessel-macos-metal/vessel release/vessel-macos-metal
          chmod +x release/vessel-linux-cpu
          chmod +x release/vessel-macos-metal

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/vessel-windows-cuda.exe
            release/vessel-windows-cpu.exe
            release/vessel-linux-cpu
            release/vessel-macos-metal
          body: |
            ## Vessel ${{ github.ref_name }}

            ### Downloads
            | Platform | Binary | Notes |
            |----------|--------|-------|
            | Windows (NVIDIA) | `vessel-windows-cuda.exe` | Requires CUDA 12+ |
            | Windows (CPU) | `vessel-windows-cpu.exe` | No GPU required |
            | Linux (CPU) | `vessel-linux-cpu` | No GPU required |
            | macOS (Apple Silicon) | `vessel-macos-metal` | M1/M2/M3/M4 |

            ### Quick Start
            ```bash
            # See what models fit your hardware
            vessel --recommend

            # Check a specific model
            vessel --model <huggingface-url>

            # Download and run
            vessel --model <url> --execute
            ```

            ### What's New
            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: false
