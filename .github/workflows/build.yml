name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Tests — Run on every push/PR (no llama.cpp needed for predictor tests)
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Configure and Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --config Debug -j2

      - name: Run Catalog Tests
        run: ./build/bin/catalog_test

      - name: Run Recommendation Tests
        run: ./build/bin/recommend_test

      - name: Run Predictor Tests
        run: ./build/bin/predictor_test

  # ===========================================================================
  # Release — Manual trigger or tag push
  # ===========================================================================
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Vessel ${{ github.ref_name }}

            ### Quick Start
            Download `vessel-windows-cuda.exe` (NVIDIA) or `vessel-windows-cpu.exe` (CPU-only) and run:

            ```bash
            # See what models fit your hardware
            vessel.exe --recommend

            # Check a specific model
            vessel.exe --model <huggingface-url>

            # Download and run
            vessel.exe --model <url> --execute
            ```

            ### Building from Source
            See [README.md](README.md#building-from-source) for build instructions.
          draft: false
          prerelease: false
