name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  # ===========================================================================
  # Windows NVIDIA (CUDA)
  # ===========================================================================
  build-windows-cuda:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          method: network
          sub-packages: '["nvcc", "cudart", "cuda_profiler"]'

      - name: Configure CMake
        run: cmake -B build -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-windows-cuda
          path: build/bin/${{ env.BUILD_TYPE }}/vessel.exe

  # ===========================================================================
  # Windows AMD (Vulkan)
  # ===========================================================================
  build-windows-vulkan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -B build -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-windows-vulkan
          path: build/bin/${{ env.BUILD_TYPE }}/vessel.exe

  # ===========================================================================
  # Linux NVIDIA (CUDA)
  # ===========================================================================
  build-linux-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          method: network
          sub-packages: '["nvcc", "cudart", "cuda_profiler"]'

      - name: Configure CMake
        run: cmake -B build -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-linux-cuda
          path: build/bin/vessel

  # ===========================================================================
  # Linux AMD (HIP/ROCm)
  # ===========================================================================
  build-linux-hip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install ROCm
        uses: ROCm/roc-setup-action@v1
        with:
          version: '6.0'

      - name: Configure CMake
        run: cmake -B build -DGGML_HIPBLAS=ON -DCMAKE_HIP_ARCHITECTURES="gfx1100;gfx1030" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-linux-hip
          path: build/bin/vessel

  # ===========================================================================
  # macOS (Metal)
  # ===========================================================================
  build-macos-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -B build -DGGML_METAL=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-macos-metal
          path: build/bin/vessel

  # ===========================================================================
  # Windows CPU-only
  # ===========================================================================
  build-windows-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-windows-cpu
          path: build/bin/${{ env.BUILD_TYPE }}/vessel.exe

  # ===========================================================================
  # Tests (Linux, runs on every PR)
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    needs: [build-linux-cuda]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Run Tests
        run: |
          cd build/bin/Debug
          ./e2e_test
          ./recommend_test
          ./catalog_test
          ./predictor_test

  # ===========================================================================
  # Create GitHub Release (on tag push)
  # ===========================================================================
  release:
    needs: [build-windows-cuda, build-windows-vulkan, build-linux-cuda, build-linux-hip, build-macos-metal, build-windows-cpu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release files
        run: |
          mkdir -p release
          mv vessel-windows-cuda/vessel.exe release/vessel-windows-cuda.exe
          mv vessel-windows-vulkan/vessel.exe release/vessel-windows-vulkan.exe
          mv vessel-linux-cuda/vessel release/vessel-linux-cuda
          mv vessel-linux-hip/vessel release/vessel-linux-hip
          mv vessel-macos-metal/vessel release/vessel-macos-metal
          mv vessel-windows-cpu/vessel.exe release/vessel-windows-cpu.exe
          chmod +x release/vessel-linux-*
          chmod +x release/vessel-macos-*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/vessel-windows-cuda.exe
            release/vessel-windows-vulkan.exe
            release/vessel-windows-cpu.exe
            release/vessel-linux-cuda
            release/vessel-linux-hip
            release/vessel-macos-metal
          body: |
            ## Vessel ${{ github.ref_name }}

            ### Downloads
            | Platform | Binary | Notes |
            |----------|--------|-------|
            | Windows (NVIDIA) | `vessel-windows-cuda.exe` | Requires CUDA 12+ |
            | Windows (AMD) | `vessel-windows-vulkan.exe` | Experimental |
            | Windows (CPU) | `vessel-windows-cpu.exe` | No GPU required |
            | Linux (NVIDIA) | `vessel-linux-cuda` | Requires CUDA 12+ |
            | Linux (AMD) | `vessel-linux-hip` | Requires ROCm 6+ |
            | macOS (Apple Silicon) | `vessel-macos-metal` | M1/M2/M3/M4 |

            ### Quick Start
            ```bash
            # See what models fit your hardware
            vessel --recommend

            # Check a specific model
            vessel --model <huggingface-url>

            # Download and run
            vessel --model <url> --execute
            ```

            ### What's New
            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: false
