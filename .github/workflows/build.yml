name: Build and Test

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Tests — Run on every push/PR (no llama.cpp needed)
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Wno-unused-parameter -Wno-unused-variable -Wno-unused-function"

      - name: Build tests
        run: cmake --build build --target catalog_test predictor_test -j$(nproc)

      - name: Run catalog_test
        run: ./build/bin/catalog_test

      - name: Run predictor_test
        run: ./build/bin/predictor_test

  # ===========================================================================
  # Release — Tag push creates GitHub Release with the local binary
  # ===========================================================================
  release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Vessel ${{ github.ref_name }}

            ### Quick Start
            Download the Windows binary and run:

            ```bash
            # See what models fit your hardware
            vessel.exe --recommend

            # Check a specific model
            vessel.exe --model <huggingface-url>

            # Download and run
            vessel.exe --model <url> --execute
            ```

            ### Building from Source
            See [README.md](README.md#building-from-source) for build instructions.
          draft: false
          prerelease: false
